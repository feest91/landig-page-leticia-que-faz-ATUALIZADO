    <div id="root"></div>

      id="cookie-banner"

      aria-label="Aviso de cookies"

    >

            id="cookie-accept"
            
          >
            Aceitar
          </button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (localStorage.getItem("lqf-cookie-consent")) return;
        } catch (e) {}
        var banner = document.getElementById("cookie-banner");
        banner.style.display = "block";
        function choose(value) {
          try {
            localStorage.setItem("lqf-cookie-consent", value);
          } catch (e) {}
          banner.style.display = "none";
        }
        document.getElementById("cookie-accept").addEventListener("click", function () { choose("all"); });
        document.getElementById("cookie-essential").addEventListener("click", function () { choose("essential"); });
      })();
    </script>
